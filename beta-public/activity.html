<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Light Years — Live Activity</title><style>:root{font-family:system-ui;color:#17233d;background:#f3f6fc}*{box-sizing:border-box}body{margin:0}header{background:#173a6a;color:white;padding:22px}main{max-width:1000px;margin:auto;padding:18px}.card{background:white;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 3px 16px #1232}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.stat{font-size:1.8rem;font-weight:700}.muted{color:#596579}.event{padding:9px 0;border-bottom:1px solid #e5e9f0}.live{font-weight:700}button,input{font:inherit;padding:10px;border-radius:9px}button{border:0;background:#245d9d;color:white;cursor:pointer}input{border:1px solid #aab5c8;width:100%}#panel{display:none}</style></head><body><header><h1>🐘 Light Years Live Activity</h1><div>Private beta activity monitor</div></header><main><section class="card" id="login"><h2>Dashboard access</h2><p>Enter the private dashboard key.</p><input id="key" type="password" autocomplete="current-password"><button id="open">Open dashboard</button><p id="err"></p></section><div id="panel"><section class="grid"><div class="card"><div class="muted">Events recorded</div><div class="stat" id="events">–</div></div><div class="card"><div class="muted">Sessions</div><div class="stat" id="sessions">–</div></div><div class="card"><div class="muted">Completed</div><div class="stat" id="completed">–</div></div><div class="card"><div class="muted">Feedback</div><div class="stat" id="feedback">–</div></div></section><section class="card"><h2><span class="live">● LIVE</span> Recent activity</h2><p class="muted">Refreshes automatically every 5 seconds. Historical events remain recorded in the beta database.</p><div id="feed"></div></section></div></main><script>const API="https://hhkorqwbyyhzwmwtnfue.supabase.co/functions/v1/beta-dashboard";let timer;const $=x=>document.getElementById(x);async function load(){try{const r=await fetch(API,{headers:{"x-dashboard-key":$("key").value}});if(!r.ok)throw 0;const d=await r.json();$("login").style.display="none";$("panel").style.display="block";$("events").textContent=d.summary.events;$("sessions").textContent=d.summary.sessions;$("completed").textContent=d.summary.completed;$("feedback").textContent=d.summary.feedback;$("feed").innerHTML=d.events.map(e=>'<div class="event"><b>'+new Date(e.created_at).toLocaleTimeString()+'</b> · '+esc(e.event)+(e.stage?' · '+esc(e.stage):'')+(e.message?' — '+esc(e.message):'')+'</div>').join("")||"No activity yet.";if(!timer)timer=setInterval(load,5000)}catch(e){$("err").textContent="That key did not work."}}function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}$("open").onclick=load;$("key").addEventListener("keydown",e=>{if(e.key==="Enter")load()});</script></body></html>
